[package]
name = "soroban-explorer-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.soroban-explorer]
path = ".."

[[bin]]
name = "submit_event"
path = "fuzz_targets/submit_event.rs"
test = false
doc = false

[[bin]]
name = "register_contract"
path = "fuzz_targets/register_contract.rs"
test = false
doc = false

[profile.release]
debug = 1
